<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>B.Tech Tests Dashboard</title>
    <!-- Phosphor Icons for UI elements -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Google Fonts for Aesthetic Vibe -->
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;600;800&family=DotGothic16&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="main-header">
        <h1 class="large-title">Test Data<br>(1-Term)</h1>
        <p class="middle-subtitle">B.Tech CSE<br>(Robotics & AI)</p>
        <button class="hamburger-btn" id="hamburger-btn" aria-label="Menu">
            <i class="ph ph-list"></i>
        </button>
        <div class="header-links" id="header-links">
            <!-- JS populates course links here -->
        </div>
    </header>

    <nav class="sticky-pill-nav" id="sticky-nav">
        <!-- JS populates course links here -->
    </nav>

    <div class="ios-app">
        <main class="ios-content" id="course-container">
            <!-- Course cards (Grouped lists) will be generated here by JS -->
        </main>

        <footer class="ios-footer">
            <p>ETE: End Term Test &bull; MTT: Mid Term Test &bull; ETP: End Term Practical</p>
            <p class="watermark">🚀 Made with Antigravity by Prabhat Yadav ✨</p>
        </footer>
    </div>

    <!-- Bottom Sheet Modal -->
    <div class="ios-modal-overlay" id="edit-modal">
        <div class="ios-bottom-sheet">
            <div class="sheet-handle"></div>

            <div class="sheet-header">
                <button class="sheet-btn" id="cancel-modal">Cancel</button>
                <h3 id="modal-title" class="sheet-title">Edit Details</h3>
                <button class="sheet-btn bold" id="save-modal" form="details-form">Save</button>
            </div>

            <div class="sheet-content">
                <form id="details-form">

                    <div class="ios-form-group">
                        <div class="ios-form-row">
                            <label for="test-date">Date</label>
                            <input type="date" id="test-date" name="test-date">
                        </div>
                        <div class="ios-form-row">
                            <label for="test-time">Start Time</label>
                            <input type="time" id="test-time" name="test-time">
                        </div>
                        <div class="ios-form-row">
                            <label for="test-end-time">End Time</label>
                            <input type="time" id="test-end-time" name="test-end-time">
                        </div>
                    </div>

                    <div class="ios-form-group">
                        <div class="ios-form-row">
                            <label for="test-weightage">Weightage (%)</label>
                            <input type="number" id="test-weightage" name="test-weightage" placeholder="e.g. 20"
                                style="width: 80px;">
                        </div>
                        <div class="ios-form-row">
                            <label for="test-marks">Total Marks</label>
                            <input type="number" id="test-marks" name="test-marks" placeholder="e.g. 30"
                                style="width: 80px;">
                        </div>
                        <div class="ios-form-row">
                            <label for="test-neg-mark">Negative Marking</label>
                            <input type="number" step="0.01" id="test-neg-mark" name="test-neg-mark"
                                placeholder="e.g. -0.25" style="width: 80px;">
                        </div>
                    </div>

                    <div class="ios-form-group">
                        <div class="ios-form-row">
                            <label for="test-q-type">Question Type</label>
                            <select id="test-q-type" name="test-q-type" class="ios-select">
                                <option value="">Select Type</option>
                                <option value="MCQ">MCQ</option>
                                <option value="Subjective">Subjective</option>
                                <option value="Both">Both</option>
                            </select>
                        </div>

                        <div class="ios-form-row">
                            <label for="test-optional">Requirement</label>
                            <select id="test-optional" name="test-optional" class="ios-select">
                                <option value="Mandatory">Mandatory</option>
                                <option value="Optional">Optional</option>
                            </select>
                        </div>

                        <div id="mcq-details" style="display:none;">
                            <div class="ios-form-row" style="background: rgba(0,0,0,0.03);">
                                <label for="mcq-total" style="font-size: 15px; font-weight: 500;">MCQs Total</label>
                                <input type="number" id="mcq-total" placeholder="e.g. 30" style="width: 80px;">
                            </div>
                            <div class="ios-form-row" style="background: rgba(0,0,0,0.03);">
                                <label for="mcq-attempt" style="font-size: 15px; font-weight: 500;">MCQs to
                                    Attempt</label>
                                <input type="number" id="mcq-attempt" placeholder="e.g. 25" style="width: 80px;">
                            </div>
                        </div>

                        <div id="sub-details" style="display:none;">
                            <div class="ios-form-row" style="background: rgba(0,0,0,0.03);">
                                <label for="sub-total" style="font-size: 15px; font-weight: 500;">Subjective
                                    Total</label>
                                <input type="number" id="sub-total" placeholder="e.g. 6" style="width: 80px;">
                            </div>
                            <div class="ios-form-row" style="background: rgba(0,0,0,0.03);">
                                <label for="sub-attempt" style="font-size: 15px; font-weight: 500;">Subjective to
                                    Attempt</label>
                                <input type="number" id="sub-attempt" placeholder="e.g. 5" style="width: 80px;">
                            </div>
                        </div>
                    </div>

                    <div class="ios-form-group">
                        <textarea id="test-syllabus" name="test-syllabus" rows="3" placeholder="Syllabus"></textarea>
                    </div>

                    <div class="ios-form-group">
                        <textarea id="test-notes" name="test-notes" rows="3" placeholder="Notes"></textarea>
                    </div>

                    <input type="hidden" id="modal-course-id">
                    <input type="hidden" id="modal-test-id">
                </form>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
